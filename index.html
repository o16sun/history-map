<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歴史風景マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .popup-img {
            width: 100%;
            max-width: 220px;
            height: auto;
            margin-top: 8px;
            border-radius: 6px;
            object-fit: cover;
        }
        .post-btn-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .post-btn {
            display: inline-block;
            padding: 10px 18px;
            background-color: #1a73e8;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .post-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <!-- 右上の投稿ボタン -->
    <div class="post-btn-container">
