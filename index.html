<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴史風景マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .popup-img {
            width: 100%;
            max-width: 240px;
            height: auto;
            margin-top: 8px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .popup-img:hover {
            opacity: 0.85;
        }
        .post-btn-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }
        .post-btn {
            display: inline-block;
            padding: 12px 22px;
            background-color: #1a73e8;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            font-size: 16px;
        }
        .post-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="post-btn-container">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDAu2P0MA6PYdFz-dX_sAW-VX24rxKbVaoqwms1dB1iRFxkA/viewform?usp=header" target="_blank" class="post-btn">投稿する</a>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        var map = L.map('map').setView([36.5, 137.5], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // GoogleドライブのURLから画像を表示可能な形式に変換する関数
        function convertDriveUrl(url) {
            if (!url) return '';
            var fileId = '';

            var match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) fileId = match1[1];

            if (!fileId) {
                var match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) fileId = match2[1];
            }

            if (!fileId) {
                var match3 = url.match(/open\?id=([a-zA-Z0-9_-]+)/);
                if (match3 && match3[1]) fileId = match3[1];
            }

            if (fileId) {
                return 'https://lh3.googleusercontent.com/d/' + fileId;
            }
            return url;
        }

        function addMarkerToMap(title, era, description, author, locationStr, imgUrl) {
            var popupContent = "<b>" + title + "</b>";
            if (era) popupContent += "<br><small>(" + era + ")</small>";
            
            // 1. 説明文が確実に表示されるように修正
            if (description && description.trim() !== "") {
                popupContent += "<br><div style='margin-top: 6px; font-size: 14px;'>" + description + "</div>";
            }
            
            var directImgUrl = convertDriveUrl(imgUrl);
            if (directImgUrl) {
                // 2. スマホで画像をタップすると別タブで大きく（フルサイズで）開くように修正
                popupContent += "<br><a href='" + directImgUrl + "' target='_blank' title='タップして画像を拡大'><img src='" + directImgUrl + "' class='popup-img' alt='" + title + "'></a>";
            }
            
            if (author) popupContent += "<br><br><small>投稿者: " + author + "</small>";

            // 座標形式 (緯度, 経度) の場合
            if (locationStr.indexOf(',') !== -1) {
                var parts = locationStr.split(',');
                var lat = parseFloat(parts[0].trim());
                var lng = parseFloat(parts[1].trim());
                if (!isNaN(lat) && !isNaN(lng)) {
                    L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                }
            } else if (locationStr.trim() !== "") {
                // 3. 英語や外国語の住所でも正しく認識するように Nominatim の検索言語を自動適応・拡張
                var searchUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(locationStr) + '&accept-language=en,ja';
                
                fetch(searchUrl)
                    .then(function(res){ return res.json(); })
                    .then(function(data){
                        if (data && data.length > 0) {
                            var lat = parseFloat(data[0].lat);
                            var lng = parseFloat(data[0].lon);
                            L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        }
                    })
                    .catch(function(err){ console.error(err); });
            }
        }

        var csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgpsS1Bqgs0hbln0HkezioWWcFdlEUHTM1qosNRlrFEZdWbnGrnhgdIgw4x74OIwPXxQs7T70ADmyG/pub?output=csv';

        Papa.parse(csvUrl, {
            download: true,
            header: false,
            complete: function(results) {
                var rows = results.data;
                for (var i = 1; i < rows.length; i++) {
                    var item = rows[i];
                    if (!item || item.length < 8) continue;

                    var title = item[1] || '';       // B列: タイトル
                    var location = item[2] || '';    // C列: 住所または座標
                    var era = item[3] || '';         // D列: 時代・年代
                    var description = item[4] || ''; // E列: 説明・歴史
                    var imgUrl = item[5] || '';      // F列: 画像
                    var author = item[6] || '';      // G列: 投稿者名
                    var status = item[7] || '';      // H列: 掲載許可

                    if (status.trim().toLowerCase() !== 'ng' && location.trim() !== '') {
                        addMarkerToMap(title, era, description, author, location, imgUrl);
                    }
                }
            }
        });
    </script>
</body>
</html>
