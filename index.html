<head>
    <meta charset="UTF-8">
    <title>歴史風景マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
        .popup-img { width: 100%; max-width: 200px; height: auto; margin-top: 8px; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map("map").setView([35.6812, 139.7671], 6);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0Sq52Je9MzQbPIzhiUtoZPxriXZFdKecHHKVwUZ3Xqq4KubMpLSpG25JRAGF_8c2rJXaqrLVn5b/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                results.data.forEach(function(row) {
                    if (row.lat && row.lng) {
                        var lat = parseFloat(row.lat);
                        var lng = parseFloat(row.lng);
                        var popupContent = "<b>" + (row.name || "") + "</b><br>" + (row.description || "");
                        if (row.image && row.image.trim() !== "") {
                            popupContent += "<br><img src=\"" + row.image.trim() + "\" class=\"popup-img\">";
                        }
                        L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                    }
                });
            }
        });
    </script>
</body>
</html>
