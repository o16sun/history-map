<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歴史風景マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
        .popup-img { width: 100%; max-width: 200px; height: auto; margin-top: 8px; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map("map").setView([35.6812, 139.7671], 6);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0Sq52Je9MzQbPIzhiUtoZPxriXZFdKecHHKVwUZ3Xqq4KubMpLSpG25JRAGF_8c2rJXaqrLVn5b/pub?output=csv";

        Papa.parse(csvUrl, {
download: true,
header: true,
complete: function(results) {
results.data.forEach(function(row) {
var coordStr = row["住所または座標"];
if (coordStr && coordStr.includes(",")) {
var parts = coordStr.split(",");
var lat = parseFloat(parts[0].trim());
var lng = parseFloat(parts[1].trim());
if (!isNaN(lat) && !isNaN(lng)) {
    var title = row["場所の名称"] || "";
    var era = row["時代・年"] || "";
    var desc = row["説明・歴史"] || "";
    var popupContent = "**" + title + "** (" + era + ")

" + desc;
var imgUrl = row["画像URL"];
if (imgUrl && imgUrl.trim() !== "") {
popupContent += "

";
}
L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
}
});
}
});
        });
        
    </script>
</body>
</html>
</html>
