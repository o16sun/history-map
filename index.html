<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>歴史風景マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
.popup-img { width: 100%; max-width: 200px; height: auto; margin-top: 8px; border-radius: 4px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"＞＜/script＞
<script＞
document.addEventListener("DOMContentLoaded", function() {
var map = L.map("map").setView([35.6812, 139.7671], 6);
if (row.lat && row.lng) {
          var lat = parseFloat(row.lat);
          var lng = parseFloat(row.lng);
          
          var popupContent = "小なりb大なり" + (row.name || "") + "小なり/b大なり小なりbr大なり" + (row.description || "");
          if (row.image && row.image.trim() !== "") {
            popupContent += "小なりbr大なり小なりimg src='" + row.image.trim() + "' class='popup-img'大なり";
          }

          L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
        }
      });
    }
  });
});
</script>
</body>
</html>
